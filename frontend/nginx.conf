server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    # Re-resolve the service name when Docker replaces the backend container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # No URI suffix: preserve the complete original /api/ path and query.
        set $backend_endpoint http://backend:8080;
        proxy_pass $backend_endpoint;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # A bounded AI batch may take up to 55 seconds; other APIs remain fast.
        proxy_read_timeout 75s;
    }

    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
