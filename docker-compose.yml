name: dut-connect

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dut_connect}
      POSTGRES_USER: ${POSTGRES_USER:-dut_connect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dut_connect_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dut_connect}}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${POSTGRES_USER:-dut_connect}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${POSTGRES_PASSWORD:-dut_connect_dev}}
      SERVER_PORT: 8080
      APP_GOOGLE_CLIENT_ID: ""
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Configure APP_JWT_SECRET in .env before startup}
      APP_ACCESS_TOKEN_TTL_MINUTES: ${APP_ACCESS_TOKEN_TTL_MINUTES:-15}
      APP_REFRESH_TOKEN_TTL_DAYS: ${APP_REFRESH_TOKEN_TTL_DAYS:-7}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost}
      APP_BOOTSTRAP_ADMIN_ENABLED: ${APP_BOOTSTRAP_ADMIN_ENABLED:-false}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_STUDENT_ID: ${APP_BOOTSTRAP_ADMIN_STUDENT_ID:-}
      APP_BOOTSTRAP_ADMIN_FULL_NAME: ${APP_BOOTSTRAP_ADMIN_FULL_NAME:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      APP_DONATION_MIN_VND: ${APP_DONATION_MIN_VND:-10000}
      APP_DONATION_MAX_VND: ${APP_DONATION_MAX_VND:-100000000}
      ZALOPAY_APP_ID: ${ZALOPAY_APP_ID:-}
      ZALOPAY_KEY1: ${ZALOPAY_KEY1:-}
      ZALOPAY_KEY2: ${ZALOPAY_KEY2:-}
      ZALOPAY_CREATE_ORDER_URL: ${ZALOPAY_CREATE_ORDER_URL:-https://sb-openapi.zalopay.vn/v2/create}
      ZALOPAY_QUERY_ORDER_URL: ${ZALOPAY_QUERY_ORDER_URL:-https://sb-openapi.zalopay.vn/v2/query}
      ZALOPAY_CALLBACK_URL: ${ZALOPAY_CALLBACK_URL:-}
      ZALOPAY_REDIRECT_URL: ${ZALOPAY_REDIRECT_URL:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_MAX_APPLICANTS: ${AI_MAX_APPLICANTS:-20}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
